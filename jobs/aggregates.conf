# Dashboard settings of the job agent-usage-tracker.aggregates (job-runner DESIGN §11), deployed beside aggregates.sh by install.sh,
# which gives them to the dashboard (put-conf.sh: on the VM a symlink, elsewhere a copy sent to the VM).
# KEY=value; KEY@<machine>=value for one machine; every key and its default: ~/dev/job-runner/dashboard/conf/_default.conf.
RED_AFTER_MIN=30                 # red: no success on any machine for 30 min (a check every 5 min)
SILENT_AFTER_MIN@H-Frank-1=15    # grey: the VM silent for 15 min
FOLD=SKIP WAIT
HISTORY=10
